name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check
      - name: Run clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        if: matrix.check == 'test'
        run: cargo test --workspace

  desktop:
    name: Desktop frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build

  desktop-rust:
    name: Desktop Rust (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build frontend for Tauri build scripts
        run: pnpm build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check desktop all targets without local AI
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --no-default-features
      - name: Test desktop all targets without local AI
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --no-default-features

  local-ai:
    name: Desktop Rust (local-ai opt-in)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check native local-ai feature
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features --features local-ai

  ios-rust:
    name: iOS Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build frontend for generated Tauri sources
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.10.1
      - name: Check iOS device target
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target aarch64-apple-ios --no-default-features
      - name: Check iOS simulator targets
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target aarch64-apple-ios-sim --no-default-features
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-apple-ios --no-default-features
      - name: Link unsigned iOS simulator app
        working-directory: apps/desktop
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            target="aarch64-sim"
          else
            target="x86_64"
          fi
          cargo tauri ios build --debug --target "$target" --ci
